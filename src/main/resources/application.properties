spring.application.name=catalogo-clientes
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clientes}
spring.datasource.username=${DB_USERNAME:clientes}
spring.datasource.password=${DB_PASSWORD:clientes}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
