services:
  postgres:
    image: postgres:16-alpine
    container_name: catalogo-clientes-db
    environment:
      POSTGRES_DB: clientes
      POSTGRES_USER: clientes
      POSTGRES_PASSWORD: clientes
    ports:
      - "5432:5432"
    volumes:
      - clientes_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientes -d clientes"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clientes_data:
